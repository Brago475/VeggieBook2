# VeggieBook2 stack.
#
# Replaces the ad-hoc `docker run` commands used to bring up the first
# containers. Everything about how the stack runs now lives in the repo, so a
# rebuilt server reproduces it with one command instead of shell history.
#
#   cd ~/VeggieBook2
#   docker compose up -d
#
# PORT BINDINGS. Everything is bound to 127.0.0.1, including web. ufw does NOT
# block Docker published ports, so the bind address is the only thing keeping
# the LAN out. cloudflared runs on the host and connects to localhost:8080
# (see /etc/cloudflared/config.yml), so the tunnel does not need web on
# 0.0.0.0.
#
# This also matters for the API: it trusts Cloudflare's CF-Connecting-IP
# header to rate limit sign-ins per visitor. That header can only be trusted
# if the tunnel is the only way to reach nginx.
#
# Services reach each other by name over the internal network regardless of
# what is published.

name: veggiebook2

services:

  db:
    image: postgres:16-alpine
    container_name: veggiebook-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
    container_name: veggiebook-web
    restart: unless-stopped
    ports:
      # Localhost only. cloudflared connects here from the host.
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    volumes:
      # The site now comes from the image, built from web/ by its Dockerfile.
      # Only the images and the nginx config are still mounted from the host.
      # deploy/placeholder is no longer served but is kept in the repo as a
      # fallback if the build ever needs to be bypassed.
      #
      # Mounted as siblings, not nested. Mounting images inside a read-only
      # web mount fails: Docker has to create the mountpoint directory, and it
      # cannot create anything inside a read-only mount.
      - ./images:/srv/images:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    build:
      context: ./api
    container_name: veggiebook-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Host is the service name, not localhost: inside the container network,
      # localhost means the api container itself.
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
      # Session cookie encryption keys, kept in the api-keys volume below.
      # The API refuses to start in production without this.
      DataProtection__KeysPath: /keys
    ports:
      # Localhost only. nginx reaches it by service name over the internal
      # network; this binding exists for debugging from the server shell.
      - "127.0.0.1:5000:8080"
    volumes:
      - api-keys:/keys
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    # Matches the volume created by hand on 09-04, so the existing data is
    # picked up rather than a new empty volume being created.
    name: veggiebook-pgdata
    external: true

  api-keys:
    # Created by compose on first start. Deleting it signs everyone out, but
    # loses no data: accounts and books live in the database.
    name: veggiebook-api-keys