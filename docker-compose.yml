# VeggieBook2 stack.
#
#   cd ~/VeggieBook2
#   docker compose up -d
#
# All ports bind to 127.0.0.1. ufw does not filter Docker published ports, so
# the bind address keeps the LAN out. cloudflared on the host reaches web on
# localhost:8080 and admin on localhost:8081 (see /etc/cloudflared/config.yml).
# The API trusts Cloudflare's CF-Connecting-IP for sign-in rate limits, which is
# only safe while the tunnel is the sole way in.

name: veggiebook2

services:

  db:
    image: postgres:16-alpine
    container_name: veggiebook-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
    container_name: veggiebook-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    volumes:
      # Images and nginx config are mounted as siblings; a mount inside a
      # read-only mount fails.
      - ./images:/srv/images:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  admin:
    build:
      context: ./admin
    container_name: veggiebook-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    volumes:
      - ./images:/srv/images:ro
      - ./deploy/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    build:
      context: ./api
    container_name: veggiebook-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Host is the service name; localhost inside the container is the API itself.
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
      # Session cookie keys. Required in production.
      DataProtection__KeysPath: /keys
      # Photos read when building book PDFs.
      Images__Path: /srv/images
    ports:
      # For debugging from the server shell only.
      - "127.0.0.1:5000:8080"
    volumes:
      - api-keys:/keys
      - ./images:/srv/images:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    # Created by hand on 2026-09-04; external so existing data is reused.
    name: veggiebook-pgdata
    external: true

  api-keys:
    # Deleting it signs everyone out; accounts and books are unaffected.
    name: veggiebook-api-keys