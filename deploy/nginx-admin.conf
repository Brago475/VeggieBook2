# nginx config for the admin site (admin.veggiebook2.com).
# Same API and images as the main site; see deploy/nginx.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the admin site out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /images/ {
        alias /srv/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri @missing_image;
    }

    location @missing_image {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Trailing slash on proxy_pass must match deploy/nginx.conf.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}