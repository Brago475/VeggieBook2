# nginx config for VeggieBook2.
#
# The site and the images are mounted separately (see docker-compose.yml), so
# /images/ is served from its own root rather than from inside the web root.
# Requests still look like /images/recipe/BR-202/photo1.jpg to the browser.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Recipe photos, tip illustrations, Secrets artwork, logos.
    # 136 MB of static content that never changes, so cache it hard.
    location /images/ {
        alias /srv/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The API, once it exists. Commented until the api service is running,
    # since nginx refuses to start if it cannot resolve an upstream name.
    #
    # location /api/ {
    #     proxy_pass http://api:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Single-page app fallback. Harmless with the current placeholder, and
    # required once the React router is in place.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
