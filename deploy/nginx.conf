# nginx config for VeggieBook2.
#
# The site and the images are mounted separately (see docker-compose.yml), so
# /images/ is served from its own root rather than from inside the web root.
# Requests still look like /images/recipe/BR-202/photo1.jpg to the browser.
#
# Security headers are set at the server level. A location that adds its own
# headers stops inheriting them, so those locations repeat the same five.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Recipe photos, tip illustrations, Secrets artwork, logos.
    # 136 MB of static content that never changes, so cache it hard.
    #
    # A missing file goes to @missing_image instead of a plain 404, so the
    # "not found" is marked no-store. Otherwise Cloudflare and browsers can
    # keep a 404 for hours, and an image deployed after someone first asked
    # for it stays broken for that person.
    location /images/ {
        alias /srv/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri @missing_image;
    }

    location @missing_image {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 404;
    }

    # The app's built scripts and styles. Vite puts a content hash in every
    # file name, so a new build always uses new names and these can be kept
    # for a year. A missing file is a plain 404, never index.html, so a
    # browser cannot cache the page in place of a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The page itself is never cached, so a deploy shows up on the next visit.
    #
    # The Content Security Policy is in report-only mode: the browser blocks
    # nothing and logs what it would have blocked in the console. Switch the
    # header name to Content-Security-Policy once the console shows no
    # reports during a full test of the site.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # The API. Note the trailing slash on proxy_pass: it strips the /api/
    # prefix, so /api/vegetables reaches the container as /api/vegetables only
    # because the controllers are themselves routed under api/. Changing either
    # side without the other breaks every endpoint.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback: any other address loads the app, which reads
    # the address itself. Real files such as robots.txt are served as they are.
    location / {
        try_files $uri $uri/ /index.html;
    }
}