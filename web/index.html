<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/LogoVB2.png" />
    <link rel="apple-touch-icon" href="/LogoVB2.png" />
    <title>VeggieBook</title>
    <meta name="description" content="Quick Help for Meals" />

    <!-- Fetched early so the logo is on the loading screen from the start. -->
    <link rel="preload" as="image" href="/brand/logo-positive-en.png" />

    <!--
      Loading screen styles live here so they apply before the JavaScript
      bundle loads. components/layout/LoadingScreen.tsx uses the same class
      names, so the handover between the two cannot be seen.

      Colors are written out because tokens.css has not loaded yet.

      The vegetable icons are Microsoft Fluent Emoji, MIT license, kept with
      the files in public/icons/veg/LICENSE.txt.
    -->
    <style>
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        opacity: 1;
        transition: opacity 0.35s ease;
      }

      /* Fade out once the app is ready. Must match SPLASH_FADE_MS. */
      .loading-screen.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        width: 240px;
        max-width: 70vw;
        height: auto;
        margin-bottom: 40px;
      }

      .loading-label {
        margin: 0 0 20px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a8a80;
      }

      .loading-progress {
        width: min(320px, 80vw);
      }

      /* A gray row underneath and a full-color row on top, revealed left to
         right on the same timing as the bar. */
      .loading-veg {
        position: relative;
        margin-bottom: 14px;
      }

      .loading-veg-row {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
      }

      .loading-veg-row img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1;
      }

      .loading-veg-base img {
        filter: grayscale(1);
        opacity: 0.28;
      }

      .loading-veg-lit {
        position: absolute;
        inset: 0;
        clip-path: inset(0 100% 0 0);
        animation: loading-reveal 2.6s ease-in-out infinite;
        animation-delay: var(--loading-offset, 0s);
      }

      .loading-track {
        height: 10px;
        overflow: hidden;
        background: #eef3e6;
        border-radius: 999px;
      }

      .loading-track-fill {
        height: 100%;
        background: linear-gradient(90deg, #8cc63e, #6fa32c);
        border-radius: 999px;
        transform: scaleX(0);
        transform-origin: left center;
        animation: loading-fill 2.6s ease-in-out infinite;
        animation-delay: var(--loading-offset, 0s);
      }

      /* Fills over the first 80%, then holds full before starting again. */
      @keyframes loading-reveal {
        0% {
          clip-path: inset(0 100% 0 0);
        }
        80%,
        100% {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes loading-fill {
        0% {
          transform: scaleX(0);
        }
        80%,
        100% {
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-screen {
          transition: none;
        }

        .loading-veg-lit {
          animation: none;
          clip-path: none;
        }

        .loading-track-fill {
          animation: none;
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown until React starts. Keep this markup, and the order of the
         vegetables, matching components/layout/LoadingScreen.tsx. -->
    <div id="root">
      <div class="loading-screen" role="status" aria-label="Loading VeggieBook">
        <img class="loading-logo" src="/brand/logo-positive-en.png" alt="" />
        <p class="loading-label" aria-hidden="true">Loading...</p>
        <div class="loading-progress" aria-hidden="true">
          <div class="loading-veg">
            <div class="loading-veg-row loading-veg-base">
              <img src="/icons/veg/carrot.svg" alt="" />
              <img src="/icons/veg/broccoli.svg" alt="" />
              <img src="/icons/veg/tomato.svg" alt="" />
              <img src="/icons/veg/leafy-green.svg" alt="" />
              <img src="/icons/veg/corn.svg" alt="" />
              <img src="/icons/veg/cucumber.svg" alt="" />
              <img src="/icons/veg/potato.svg" alt="" />
              <img src="/icons/veg/onion.svg" alt="" />
            </div>
            <div class="loading-veg-row loading-veg-lit">
              <img src="/icons/veg/carrot.svg" alt="" />
              <img src="/icons/veg/broccoli.svg" alt="" />
              <img src="/icons/veg/tomato.svg" alt="" />
              <img src="/icons/veg/leafy-green.svg" alt="" />
              <img src="/icons/veg/corn.svg" alt="" />
              <img src="/icons/veg/cucumber.svg" alt="" />
              <img src="/icons/veg/potato.svg" alt="" />
              <img src="/icons/veg/onion.svg" alt="" />
            </div>
          </div>
          <div class="loading-track"><div class="loading-track-fill"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
